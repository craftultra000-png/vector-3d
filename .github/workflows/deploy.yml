name: Unzip and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip vector-3d.zip
        run: |
          unzip vector-3d.zip
          mv offline-app/* .
          mv offline-app/.* . 2>/dev/null || true
          rm -rf vector-3d.zip offline-app/
      
      - name: Commit unzipped files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Unzip vector-3d"
          git push
          
